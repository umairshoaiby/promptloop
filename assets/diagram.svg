<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b80"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="460" rx="16" fill="#0b0f17"/>

  <!-- title -->
  <text x="480" y="42" text-anchor="middle" fill="#e7eef6" font-size="19" font-weight="700">How PromptLoop works</text>
  <text x="480" y="63" text-anchor="middle" fill="#8fa1b6" font-size="12">one agentic loop · any model · learns from you</text>

  <!-- input -->
  <rect x="30" y="120" width="140" height="64" rx="12" fill="#121a29" stroke="#2a3a57"/>
  <text x="100" y="147" text-anchor="middle" fill="#e7eef6" font-size="13.5" font-weight="600">Your prompt</text>
  <text x="100" y="166" text-anchor="middle" fill="#8fa1b6" font-size="11">any text, any task</text>

  <!-- analyze -->
  <rect x="215" y="120" width="140" height="64" rx="12" fill="#121a29" stroke="url(#grad)" stroke-width="1.6"/>
  <text x="285" y="147" text-anchor="middle" fill="#22d3ee" font-size="13.5" font-weight="700">1 · ANALYZE</text>
  <text x="285" y="166" text-anchor="middle" fill="#8fa1b6" font-size="11">score /100 · 6 ingredients</text>

  <!-- rewrite -->
  <rect x="400" y="120" width="140" height="64" rx="12" fill="#121a29" stroke="url(#grad)" stroke-width="1.6"/>
  <text x="470" y="147" text-anchor="middle" fill="#60a5fa" font-size="13.5" font-weight="700">2 · REWRITE</text>
  <text x="470" y="166" text-anchor="middle" fill="#8fa1b6" font-size="11">for the target model</text>

  <!-- critique -->
  <rect x="585" y="120" width="140" height="64" rx="12" fill="#121a29" stroke="url(#grad)" stroke-width="1.6"/>
  <text x="655" y="147" text-anchor="middle" fill="#a78bfa" font-size="13.5" font-weight="700">3 · CRITIQUE</text>
  <text x="655" y="166" text-anchor="middle" fill="#8fa1b6" font-size="11">adversarial re-score</text>

  <!-- revise (below critique) -->
  <rect x="585" y="228" width="140" height="56" rx="12" fill="#121a29" stroke="url(#grad)" stroke-width="1.6"/>
  <text x="655" y="252" text-anchor="middle" fill="#8b5cf6" font-size="13.5" font-weight="700">4 · REVISE</text>
  <text x="655" y="270" text-anchor="middle" fill="#8fa1b6" font-size="11">smallest fixing edits</text>

  <!-- output -->
  <rect x="775" y="120" width="155" height="64" rx="12" fill="#0d1f1a" stroke="#34d399" stroke-width="1.6"/>
  <text x="852" y="147" text-anchor="middle" fill="#34d399" font-size="13.5" font-weight="700">Improved prompt</text>
  <text x="852" y="166" text-anchor="middle" fill="#8fa1b6" font-size="11">score ≥ 90 or plateau</text>

  <!-- main flow arrows -->
  <line x1="170" y1="152" x2="209" y2="152" stroke="#5b6b80" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="355" y1="152" x2="394" y2="152" stroke="#5b6b80" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="540" y1="152" x2="579" y2="152" stroke="#5b6b80" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="725" y1="152" x2="769" y2="152" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrG)"/>

  <!-- loop: critique -> revise -> critique -->
  <path d="M 690 184 L 690 222" stroke="#22d3ee" stroke-width="1.8" fill="none" marker-end="url(#arrC)"/>
  <path d="M 620 228 L 620 190" stroke="#22d3ee" stroke-width="1.8" fill="none" marker-end="url(#arrC)"/>
  <text x="756" y="212" fill="#22d3ee" font-size="11" font-weight="600">loop until</text>
  <text x="756" y="226" fill="#22d3ee" font-size="11" font-weight="600">converged</text>

  <!-- profiles box -->
  <rect x="215" y="330" width="325" height="80" rx="12" fill="#121a29" stroke="#2a3a57"/>
  <text x="377" y="356" text-anchor="middle" fill="#e7eef6" font-size="13" font-weight="700">Model behavior profiles</text>
  <text x="377" y="375" text-anchor="middle" fill="#8fa1b6" font-size="11">Claude · GPT · Gemini · DeepSeek · Llama · Mistral</text>
  <text x="377" y="392" text-anchor="middle" fill="#8fa1b6" font-size="11">instruction style · format habits · failure modes · house rules</text>

  <!-- feedback box -->
  <rect x="640" y="330" width="290" height="80" rx="12" fill="#0d1f1a" stroke="#34d399"/>
  <text x="785" y="356" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">Your feedback  👍 / 👎</text>
  <text x="785" y="375" text-anchor="middle" fill="#8fa1b6" font-size="11">votes promote rules to "learned"</text>
  <text x="785" y="392" text-anchor="middle" fill="#8fa1b6" font-size="11">or disable them — stored in your browser</text>

  <!-- profile feeds rewrite + critique -->
  <path d="M 377 330 L 377 240 Q 377 210 420 195 L 452 184" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="330" y="262" fill="#8fa1b6" font-size="11">guides every</text>
  <text x="330" y="276" fill="#8fa1b6" font-size="11">rewrite</text>

  <!-- feedback feeds profiles -->
  <line x1="640" y1="370" x2="546" y2="370" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="593" y="360" text-anchor="middle" fill="#34d399" font-size="11">teaches</text>

  <!-- result feeds feedback -->
  <path d="M 852 184 L 852 250 Q 852 280 830 300 L 800 324" stroke="#5b6b80" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
</svg>
